<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgHR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="55%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#16202e"/>
    </linearGradient>
    <linearGradient id="accentHR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cellIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cellCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bgHR)"/>

  <!-- soft glow -->
  <ellipse cx="960" cy="210" rx="320" ry="220" fill="#6366f1" opacity="0.07"/>

  <!-- faint org-chart / people network, right side -->
  <g opacity="0.22" stroke="#818cf8" stroke-width="2.5" fill="none">
    <line x1="1000" y1="90" x2="930" y2="150"/>
    <line x1="1000" y1="90" x2="1070" y2="150"/>
    <line x1="930" y1="150" x2="880" y2="210"/>
    <line x1="930" y1="150" x2="960" y2="210"/>
    <line x1="1070" y1="150" x2="1040" y2="210"/>
    <line x1="1070" y1="150" x2="1110" y2="210"/>
  </g>
  <g opacity="0.55">
    <circle cx="1000" cy="90" r="16" fill="url(#cellIndigo)"/>
    <circle cx="930" cy="150" r="13" fill="url(#cellCyan)"/>
    <circle cx="1070" cy="150" r="13" fill="url(#cellCyan)"/>
    <circle cx="880" cy="210" r="10" fill="url(#cellIndigo)"/>
    <circle cx="960" cy="210" r="10" fill="url(#cellIndigo)"/>
    <circle cx="1040" cy="210" r="10" fill="url(#cellIndigo)"/>
    <circle cx="1110" cy="210" r="10" fill="url(#cellIndigo)"/>
  </g>

  <!-- rising bar chart bottom right -->
  <g opacity="0.45">
    <rect x="900" y="300" width="26" height="70" fill="url(#cellCyan)"/>
    <rect x="942" y="270" width="26" height="100" fill="url(#cellIndigo)"/>
    <rect x="984" y="240" width="26" height="130" fill="url(#cellCyan)"/>
    <rect x="1026" y="290" width="26" height="80" fill="url(#cellIndigo)"/>
    <rect x="1068" y="255" width="26" height="115" fill="url(#cellCyan)"/>
    <rect x="1110" y="280" width="26" height="90" fill="url(#cellIndigo)"/>
  </g>

  <!-- faint people icon, left side -->
  <g opacity="0.14" stroke="#818cf8" stroke-width="5" fill="none">
    <circle cx="95" cy="195" r="26"/>
    <path d="M55 290 q40 -55 80 0"/>
    <circle cx="165" cy="215" r="20"/>
    <path d="M135 290 q30 -45 60 0"/>
  </g>

  <!-- faint dotted trend line -->
  <path d="M -20 95 C 220 40, 430 140, 650 75"
        fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round"/>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentHR)"/>

  <!-- eyebrow tag -->
  <text x="90" y="150" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="4"
        fill="#818cf8" font-weight="700">PEOPLE ANALYTICS PROJECT</text>

  <!-- main title -->
  <text x="88" y="222" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#f1f5f9">
    HR Analytics
  </text>
  <text x="88" y="284" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#f1f5f9">
    Dashboard
  </text>

  <!-- subtitle -->
  <text x="90" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#94a3b8">
    Attrition  •  Demographics  •  Satisfaction  •  Performance
  </text>

  <!-- bottom-left thin rule -->
  <rect x="90" y="344" width="120" height="3" fill="url(#accentHR)"/>
  <text x="90" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2" fill="#64748b">BUILT WITH POWER BI  ·  POWER QUERY  ·  EXCEL</text>
</svg>
